<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corregir Estados de Pedidos - Sistema Multiservicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-tools"></i> Corrección de Estados de Pedidos</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            Esta herramienta permite actualizar manualmente el estado de pedidos que deberían estar en COMPLETADO pero están en NUEVO o EN_PROCESO.
                        </div>

                        <div class="mb-3">
                            <label for="numeroPedido" class="form-label">Número de Pedido</label>
                            <input type="text" class="form-control" id="numeroPedido" placeholder="Ej: PED-20251120-0001">
                            <small class="text-muted">Ingrese el número de pedido a verificar</small>
                        </div>

                        <div class="d-grid gap-2 d-md-flex">
                            <button type="button" class="btn btn-primary" onclick="verificarPedido()">
                                <i class="fas fa-search"></i> Verificar Pedido
                            </button>
                            <button type="button" class="btn btn-success" onclick="actualizarEstado()" id="btnActualizar" style="display:none;">
                                <i class="fas fa-check"></i> Actualizar a COMPLETADO
                            </button>
                        </div>

                        <div id="resultadoDiv" class="mt-4" style="display:none;">
                            <hr>
                            <h5>Información del Pedido</h5>
                            <div id="infoContent"></div>
                        </div>

                        <div id="resultadoActualizacion" class="mt-3"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <a href="dashboard.html" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver al Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>

    <script>
        // Verificar autenticación
        AuthService.checkAuth();

        // API_BASE_URL viene de config.js
        const API_URL = API_BASE_URL;

        const user = AuthService.getUser();

        // Verificar que solo ADMIN pueda acceder
        if (user.rol !== 'ADMIN') {
            alert('Solo administradores pueden acceder a esta herramienta');
            window.location.href = 'dashboard.html';
        }

        let pedidoActual = null;

        async function verificarPedido() {
            const numeroPedido = document.getElementById('numeroPedido').value.trim();

            if (!numeroPedido) {
                alert('Por favor ingrese un número de pedido');
                return;
            }

            try {
                // Obtener todos los pedidos y buscar el que coincida
                const response = await PedidoService.getAll();

                if (response.success && response.data) {
                    const pedidoEncontrado = response.data.find(p => p.numeroPedido === numeroPedido);
                    pedidoActual = pedidoEncontrado;

                    if (!pedidoActual) {
                        document.getElementById('resultadoDiv').style.display = 'block';
                        document.getElementById('infoContent').innerHTML = `
                            <div class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle"></i>
                                No se encontró un pedido con el número: ${numeroPedido}
                            </div>
                        `;
                        document.getElementById('btnActualizar').style.display = 'none';
                        return;
                    }

                    // Verificar si tiene facturas
                    const facturaResponse = await FacturaService.getAll();
                    let tieneFactura = false;

                    if (facturaResponse.success && facturaResponse.data) {
                        tieneFactura = facturaResponse.data.some(f =>
                            f.pedido && f.pedido.idPedido === pedidoActual.idPedido
                        );
                    }

                    // Mostrar información
                    const infoHTML = `
                        <table class="table table-bordered">
                            <tr>
                                <th>Número de Pedido:</th>
                                <td>${pedidoActual.numeroPedido}</td>
                            </tr>
                            <tr>
                                <th>Cliente:</th>
                                <td>${pedidoActual.cliente?.nombre || ''} ${pedidoActual.cliente?.apellido || ''}</td>
                            </tr>
                            <tr>
                                <th>Estado Actual:</th>
                                <td>
                                    <span class="badge ${getEstadoBadgeClass(pedidoActual.estado)}">
                                        ${pedidoActual.estado}
                                    </span>
                                </td>
                            </tr>
                            <tr>
                                <th>Tiene Factura:</th>
                                <td>${tieneFactura ? '<span class="text-success"><i class="fas fa-check"></i> Sí</span>' : '<span class="text-danger"><i class="fas fa-times"></i> No</span>'}</td>
                            </tr>
                        </table>

                        ${tieneFactura && pedidoActual.estado !== 'COMPLETADO' ? `
                            <div class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle"></i>
                                <strong>Inconsistencia detectada:</strong> Este pedido tiene factura pero su estado es <strong>${pedidoActual.estado}</strong> en lugar de COMPLETADO.
                            </div>
                        ` : ''}

                        ${!tieneFactura ? `
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i>
                                Este pedido no tiene facturas asociadas. No se recomienda cambiar su estado a COMPLETADO.
                            </div>
                        ` : ''}
                    `;

                    document.getElementById('resultadoDiv').style.display = 'block';
                    document.getElementById('infoContent').innerHTML = infoHTML;

                    // Mostrar botón solo si tiene factura y no está en COMPLETADO
                    if (tieneFactura && pedidoActual.estado !== 'COMPLETADO') {
                        document.getElementById('btnActualizar').style.display = 'inline-block';
                    } else {
                        document.getElementById('btnActualizar').style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al verificar el pedido: ' + error.message);
            }
        }

        async function actualizarEstado() {
            if (!pedidoActual) {
                alert('No hay un pedido seleccionado');
                return;
            }

            if (!confirm(`¿Está seguro que desea actualizar el estado del pedido ${pedidoActual.numeroPedido} a COMPLETADO?`)) {
                return;
            }

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/pedidos/${pedidoActual.idPedido}/estado?estado=COMPLETADO`,
                    {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                const data = await response.json();

                if (data.meta.rc === 'ok') {
                    document.getElementById('resultadoActualizacion').innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i>
                            <strong>¡Éxito!</strong> El pedido ${pedidoActual.numeroPedido} ha sido actualizado a COMPLETADO.
                        </div>
                    `;

                    // Ocultar botón de actualizar
                    document.getElementById('btnActualizar').style.display = 'none';

                    // Volver a verificar para actualizar la vista
                    setTimeout(() => verificarPedido(), 1000);
                } else {
                    throw new Error(data.meta.msg || 'Error al actualizar el estado');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('resultadoActualizacion').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        function getEstadoBadgeClass(estado) {
            const classes = {
                'NUEVO': 'bg-info',
                'EN_PROCESO': 'bg-warning',
                'COMPLETADO': 'bg-success',
                'CANCELADO': 'bg-danger'
            };
            return classes[estado] || 'bg-secondary';
        }
    </script>
</body>
</html>
