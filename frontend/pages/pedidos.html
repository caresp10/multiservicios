<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Sistema Multiservicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- El sidebar se carga dinámicamente desde components/sidebar.html -->

        <!-- Main Content -->
        <div class="main-content">
            <nav class="top-navbar">
                <div>
                    <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                    <h5 class="d-inline ms-2">Gestión de Pedidos</h5>
                </div>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div>
                        <strong id="userName"></strong><br>
                        <small class="text-muted" id="userRole"></small>
                    </div>
                </div>
            </nav>

            <div class="content-area">
                <div class="page-header">
                    <h1><i class="fas fa-clipboard-list"></i> Gestión de Pedidos</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Pedidos</li>
                        </ol>
                    </nav>
                </div>

                <!-- Filtros -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="searchInput"
                                       placeholder="Buscar por número o cliente...">
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" id="filterEstado">
                                    <option value="">Todos los estados</option>
                                    <option value="NUEVO">Nuevo</option>
                                    <option value="EN_PROCESO">En Proceso</option>
                                    <option value="COMPLETADO">Completado</option>
                                    <option value="CANCELADO">Cancelado</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" id="filterPrioridad">
                                    <option value="">Todas las prioridades</option>
                                    <option value="BAJA">Baja</option>
                                    <option value="MEDIA">Media</option>
                                    <option value="ALTA">Alta</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <div class="input-group">
                                    <span class="input-group-text" title="Fecha desde"><i class="fas fa-calendar"></i></span>
                                    <input type="date" class="form-control" id="filterFechaDesde" title="Fecha desde">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="input-group">
                                    <span class="input-group-text" title="Fecha hasta"><i class="fas fa-calendar-check"></i></span>
                                    <input type="date" class="form-control" id="filterFechaHasta" title="Fecha hasta">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" onclick="openModalPedido()">
                                    <i class="fas fa-plus"></i> Nuevo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="table-card fade-in">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Nº Pedido</th>
                                    <th>Cliente</th>
                                    <th>Categoría</th>
                                    <th>Descripción</th>
                                    <th>Canal</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="pedidosTable">
                                <tr>
                                    <td colspan="9" class="text-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Cargando...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pedido -->
    <div class="modal fade" id="modalPedido" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPedidoTitle">
                        <i class="fas fa-clipboard-list"></i> Nuevo Pedido
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="pedidoForm">
                        <input type="hidden" id="pedidoId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Cliente *</label>
                                <div class="input-group">
                                    <select class="form-select" id="idCliente" required aria-label="Seleccionar cliente">
                                        <option value="">Seleccione un cliente</option>
                                    </select>
                                    <button class="btn btn-outline-success" type="button" onclick="abrirModalNuevoCliente()" title="Crear nuevo cliente">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoría de Servicio *</label>
                                <div class="input-group">
                                    <select class="form-select" id="idCategoria" required aria-label="Seleccionar categoría">
                                        <option value="">Seleccione una categoría</option>
                                    </select>
                                    <button class="btn btn-outline-success" type="button" onclick="abrirModalNuevaCategoria()" title="Crear nueva categoría">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Canal *</label>
                                <select class="form-select" id="canal" required>
                                    <option value="TELEFONO">Teléfono</option>
                                    <option value="WHATSAPP">WhatsApp</option>
                                    <option value="EMAIL">Email</option>
                                    <option value="PRESENCIAL">Presencial</option>
                                    <option value="WEB">Web</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prioridad *</label>
                                <select class="form-select" id="prioridad" required>
                                    <option value="BAJA">Baja</option>
                                    <option value="MEDIA" selected>Media</option>
                                    <option value="ALTA">Alta</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Descripción del Servicio *</label>
                                <textarea class="form-control" id="descripcion" rows="3" required></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Observaciones</label>
                                <textarea class="form-control" id="observaciones" rows="2"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarPedido()">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Cliente -->
    <div class="modal fade" id="modalNuevoCliente" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-user-plus"></i> Nuevo Cliente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="nuevoClienteForm">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Tipo de Cliente *</label>
                                <select class="form-select" id="clienteTipoCliente" required onchange="toggleCamposCliente()">
                                    <option value="PERSONA">Persona Física</option>
                                    <option value="EMPRESA">Empresa</option>
                                </select>
                            </div>
                            <div class="col-md-6" id="divNombre">
                                <label class="form-label" id="labelNombre">Nombre *</label>
                                <input type="text" class="form-control" id="clienteNombre" required aria-label="Nombre del cliente">
                            </div>
                            <div class="col-md-6" id="divApellido">
                                <label class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="clienteApellido" aria-label="Apellido del cliente">
                            </div>
                            <div class="col-md-12" id="divRazonSocial" style="display:none;">
                                <label class="form-label">Razón Social *</label>
                                <input type="text" class="form-control" id="clienteRazonSocial" aria-label="Razón Social">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" id="labelRucCi">RUC/CI</label>
                                <input type="text" class="form-control" id="clienteRucCi" aria-label="RUC o CI del cliente">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" id="clienteTelefono" required aria-label="Teléfono del cliente">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Celular</label>
                                <input type="tel" class="form-control" id="clienteCelular" aria-label="Celular del cliente">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="clienteEmail" aria-label="Email del cliente">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ciudad</label>
                                <input type="text" class="form-control" id="clienteCiudad" aria-label="Ciudad del cliente">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Dirección</label>
                                <textarea class="form-control" id="clienteDireccion" rows="2"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="guardarNuevoCliente()">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Categoría -->
    <div class="modal fade" id="modalNuevaCategoria" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-tag"></i> Nueva Categoría
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="nuevaCategoriaForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre de la Categoría *</label>
                            <input type="text" class="form-control" id="categoriaNombre" required
                                   placeholder="Ej: Electricidad, Plomería, etc.">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="categoriaDescripcion" rows="3"
                                      placeholder="Descripción de la categoría..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="guardarNuevaCategoria()">
                        <i class="fas fa-save"></i> Guardar Categoría
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pedidos.js"></script>
</body>
</html>
