<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas de Crédito - Sistema Multiservicios</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #modalVistaNC,
            #modalVistaNC * {
                visibility: visible;
            }
            #modalVistaNC {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .modal-backdrop {
                display: none !important;
            }
            #modalVistaNC .modal-footer {
                display: none !important;
            }
            #modalVistaNC .modal-dialog {
                max-width: 100%;
                margin: 0;
            }
            #modalVistaNC .modal-content {
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navbar -->
            <nav class="top-navbar">
                <div>
                    <button class="btn btn-link d-md-none" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h5 class="d-inline ms-2">Notas de Crédito</h5>
                </div>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div>
                        <strong id="userName"></strong><br>
                        <small class="text-muted" id="userRole"></small>
                    </div>
                </div>
            </nav>

            <!-- Content Area -->
            <div class="content-area">
                <div class="page-header">
                    <h1><i class="fas fa-file-invoice"></i> Gestión de Notas de Crédito</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Notas de Crédito</li>
                        </ol>
                    </nav>
                </div>

                <!-- Filtros -->
                <div class="table-card mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="searchInput"
                                       placeholder="Buscar por número o factura...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="filterEstado">
                                <option value="">Todos los estados</option>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="APLICADA">Aplicada</option>
                                <option value="ANULADA">Anulada</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="filterTipo">
                                <option value="">Todos los tipos</option>
                                <option value="TOTAL">Total</option>
                                <option value="PARCIAL">Parcial</option>
                            </select>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Notas de Crédito -->
                <div class="table-card">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Número NC</th>
                                    <th>Factura</th>
                                    <th>Cliente</th>
                                    <th>Tipo</th>
                                    <th>Motivo</th>
                                    <th>Fecha Emisión</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="notasCreditoTableBody">
                                <tr>
                                    <td colspan="9" class="text-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Cargando...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Vista Previa NC -->
    <div class="modal fade" id="modalVistaNC" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Vista Previa - Nota de Crédito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="vistaNCContent">
                    <!-- Se llenará dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btnImprimirNC">
                        <i class="fas fa-print"></i> Imprimir
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear NC desde Factura -->
    <div class="modal fade" id="modalCrearNC" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Nota de Crédito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Información de la factura -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Factura:</label>
                            <p id="ncFacturaInfo" class="mb-0"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Cliente:</label>
                            <p id="ncClienteInfo" class="mb-0"></p>
                        </div>
                    </div>

                    <hr>

                    <!-- Formulario NC -->
                    <form id="formCrearNC">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Tipo *</label>
                                <select class="form-select" id="ncTipo" required>
                                    <option value="TOTAL">Total</option>
                                    <option value="PARCIAL">Parcial</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Motivo *</label>
                                <select class="form-select" id="ncMotivo" required>
                                    <option value="DEVOLUCION">Devolución</option>
                                    <option value="ERROR_FACTURACION">Error en Facturación</option>
                                    <option value="DESCUENTO">Descuento</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción del motivo</label>
                            <textarea class="form-control" id="ncDescripcionMotivo" rows="2"
                                      placeholder="Describa el motivo de la nota de crédito..."></textarea>
                        </div>

                        <!-- Items de la factura -->
                        <h6 class="mb-3">Items a devolver:</h6>
                        <div id="ncItemsContainer">
                            <!-- Se llenará dinámicamente -->
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control" id="ncObservaciones" rows="2"></textarea>
                        </div>

                        <!-- Totales -->
                        <div class="row">
                            <div class="col-md-6 ms-auto">
                                <table class="table table-sm">
                                    <tr>
                                        <td class="text-end"><strong>Subtotal:</strong></td>
                                        <td class="text-end" id="ncSubtotalCalculado">₲ 0</td>
                                    </tr>
                                    <tr>
                                        <td class="text-end"><strong>IVA (10%):</strong></td>
                                        <td class="text-end" id="ncIvaCalculado">₲ 0</td>
                                    </tr>
                                    <tr>
                                        <td class="text-end"><strong>TOTAL:</strong></td>
                                        <td class="text-end fw-bold fs-5" id="ncTotalCalculado">₲ 0</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarNC">
                        <i class="fas fa-save"></i> Crear Nota de Crédito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Config & Services -->
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <!-- Page Script -->
    <script src="../js/notas-credito.js"></script>
</body>
</html>
